name: release-local-agent

# local-agent 跨平台自动构建 + GitHub Releases 发布
# 触发：推送 v* 标签（如 git tag v0.1.3 && git push origin v0.1.3）
# 产物：local-agent-<os>-<arch>[-v<tag>](.exe)，附加到对应 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GOOS-GOARCH（与 scripts/build-local-agent.sh 默认目标一致）
        target:
          - windows-amd64
          - linux-amd64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS="${TARGET%-*}"
          GOARCH="${TARGET#*-}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUT="local-agent-${TARGET}-v${{ steps.version.outputs.tag }}${EXT}"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X main.clientVersion=v${{ steps.version.outputs.tag }}" \
            -o "dist/${OUT}" ./local-agent
          echo "dist/${OUT}  ($(du -h "dist/${OUT}" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}-*

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -type f -name "local-agent-*" -exec mv {} dist/ \;
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "local-agent ${{ github.ref_name }}"
          body: |
            ## local-agent ${{ github.ref_name }}

            Knovis 本地 Agent 客户端（文件读写 / grep / 沙箱执行）。

            ### 下载对应平台
            | 平台 | 文件 |
            | --- | --- |
            | Windows 10/11 (x64) | `local-agent-windows-amd64-*.exe` |
            | Linux (x64) | `local-agent-linux-amd64-*` |
            | macOS (Intel) | `local-agent-darwin-amd64-*` |
            | macOS (Apple Silicon) | `local-agent-darwin-arm64-*` |

            ### 启动方式
            1. 解压后运行 `local-agent`（Windows 双击 exe，或命令行执行）
            2. 登录 Knovis 前端（服务器地址），登录成功后前端会自动激活本机 local-agent
            3. 可选参数：
               - `--server ws://<服务器IP>:8001` 指定服务器（默认 ws://127.0.0.1:8001）
               - `--workdir <目录>` 指定 agent 文件操作工作区（默认 ./workspace）
          files: dist/local-agent-*
