name: release-local-agent

# local-agent 跨平台自动构建 + GitHub Releases 发布
# 触发：推送 v* 标签（如 git tag v0.1.3 && git push origin v0.1.3）
# 产物：local-agent-<os>-<arch>[-v<tag>](.exe)，附加到对应 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GOOS-GOARCH（与 scripts/build-local-agent.sh 默认目标一致）
        target:
          - windows-amd64
          - linux-amd64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS="${TARGET%-*}"
          GOARCH="${TARGET#*-}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          # 压缩包内二进制用简短名 local-agent[.exe]（用户友好，双击/执行方便）
          BIN_NAME="local-agent${EXT}"
          # 压缩包名带平台+版本（便于用户区分下载哪个）
          PKG_NAME="local-agent-${TARGET}-v${{ steps.version.outputs.tag }}"
          mkdir -p dist
          # local-agent 是独立 module(自带 go.mod),必须 cd 进去再 build,
          # 不能从仓库根用 `go build ./local-agent`(根 module knovis 看不到子 module)
          cd local-agent
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X main.clientVersion=v${{ steps.version.outputs.tag }}" \
            -o "../dist/${BIN_NAME}" .
          cd ..
          echo "dist/${BIN_NAME}  ($(du -h "dist/${BIN_NAME}" | cut -f1))"
          # Windows 打 zip、Linux/mac 打 tar.gz:浏览器对压缩包下载不拦截,
          # 直接下 exe 会被 Edge/Chrome 的 MotW 机制拦截("无法下载")
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "${PKG_NAME}.zip" "$BIN_NAME"
            rm "$BIN_NAME"
          else
            tar czf "${PKG_NAME}.tar.gz" "$BIN_NAME"
            rm "$BIN_NAME"
          fi
          cd ..
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/local-agent-${{ matrix.target }}-*

  release:
    name: create-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -type f -name "local-agent-*" -exec mv {} dist/ \;
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "local-agent ${{ github.ref_name }}"
          body: |
            ## local-agent ${{ github.ref_name }}

            Knovis 本地 Agent 客户端（文件读写 / grep / 沙箱执行）。

            ### 下载对应平台
            | 平台 | 文件 |
            | --- | --- |
            | Windows 10/11 (x64) | `local-agent-windows-amd64-*.zip` |
            | Linux (x64) | `local-agent-linux-amd64-*.tar.gz` |
            | macOS (Intel) | `local-agent-darwin-amd64-*.tar.gz` |
            | macOS (Apple Silicon) | `local-agent-darwin-arm64-*.tar.gz` |

            ### 启动方式
            1. 下载对应平台的压缩包，解压到任意目录（Windows 建议非系统盘，如 `D:\local-agent\`）
            2. 双击运行 `local-agent`（Windows 为 `local-agent.exe`）
               - 首次运行会提示输入服务器地址（格式 `ws://<公网IP>:<端口>`），输入后自动保存到同目录 `config.json`，下次双击直接用
               - 也可用命令行指定: `local-agent.exe -server ws://<服务器IP>:<端口> -workdir D:\knovis-workspace`
            3. 保持窗口常开，登录 Knovis 前端，登录成功后自动激活并绑定当前账号
            4. 工作目录默认用二进制旁的 `./workspace`，可在 `config.json` 里配置 `workdir` 字段改到非 C 盘

            ### Windows SmartScreen 提示
            解压后首次运行 `local-agent.exe` 会弹"Windows 已保护你的电脑"(未签名 exe 标准拦截)。本程序开源(见源码 `local-agent/`)，可放心运行：
            点击 **更多信息** → **仍要运行** 即可。
          files: dist/local-agent-*
